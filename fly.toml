# Fly.io config for Parabellum ISOS
# After editing, rerun `fly deploy` or push to GitHub if auto-deploy is on.

app = "parabellum-isos"
primary_region = "sin"   # Singapore - closest to the Philippines

[build]
  # Uses ./Dockerfile automatically

[http_service]
  internal_port = 8080
  force_https = true
  # Save credits by spinning down when idle; restarts on next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024   # 1 GB - enough for sklearn forecast
